[workspace]
members = [
    "crates/flashbrowse-bidi",
    "crates/flashbrowse-cdp",
    "crates/flashbrowse-core",
    "crates/flashbrowse-mcp",
    "crates/flashbrowse-cli",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
futures-util = "0.3.34"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "stream"] }
# Only `deflate` is enabled: Chrome-for-Testing archives are deflate/store
# only, and the AES/LZMA/Zstd decoders are attack surface we never exercise.
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.105"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
which = "8.0.6"
dashmap = "6.2.1"
regex = "1.13.2"
async-trait = "0.1.92"
url = "2.5.9"

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nhrbuilds/flashbrowse"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
