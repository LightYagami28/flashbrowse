<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>nested</title></head>
  <body>
    <div id="root"></div>
    <script>
      let el = document.getElementById("root");
      for (let i = 0; i < 80; i++) {
        const next = document.createElement("el-" + i);
        el.appendChild(next);
        el = next;
      }
      el.textContent = "deep-leaf-token";
    </script>
  </body>
</html>
